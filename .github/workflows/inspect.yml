name: Inspect X Classes

on:
  workflow_dispatch:
    inputs:
      decrypted_ipa_url:
        description: "Direct URL of an X IPA"
        required: true
        type: string
      list_regex:
        description: "Regex of class names to list"
        default: "Account|Dashboard|Drawer|SideNav|Sidebar"
        required: true
        type: string
      dump_regex:
        description: "Regex of classes to dump in full (empty = none)"
        default: ""
        required: false
        type: string

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Probe share page
        run: |
          PAGE="${IPA_URL%%#*}"
          curl -sSL -D headers.txt -o page.html "$PAGE"
          cat headers.txt
          echo "::group::page"
          cat page.html
          echo "::endgroup::"
          ORIGIN=$(echo "$PAGE" | grep -oE '^https?://[^/]+')
          grep -oE '(src|href)="[^"]+\.js[^"]*"' page.html | sed -E 's/^(src|href)="//; s/"$//' | sort -u > scripts.txt
          cat scripts.txt
          i=0
          while read -r s; do
            case "$s" in http*) u="$s" ;; /*) u="$ORIGIN$s" ;; *) u="$ORIGIN/$s" ;; esac
            i=$((i+1)); curl -sSL -o "s$i.js" "$u" || continue
            echo "===== $u ($(wc -c < s$i.js) bytes)"
            grep -oE '.{0,200}(/api/|fetch\(|decrypt|importKey|AES|subtle|location\.hash|download).{0,200}' "s$i.js" | head -n 80
          done < scripts.txt
        env:
          IPA_URL: ${{ inputs.decrypted_ipa_url }}
